name: Build Chemie Trainer APK

on:
  push:
    paths:
      - "chemie-trainer/**"
      - ".github/workflows/build-chemie-trainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: chemie-trainer
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chemie-trainer-apk
          path: chemie-trainer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
